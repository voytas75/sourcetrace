name: CI Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  v2-offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --dev --extra dev

      - name: Run offline v2 operator smoke
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src uv run pytest -q
          tests/unit/v2/test_operator_entrypoint.py
          tests/unit/v2/test_runtime_composition.py
