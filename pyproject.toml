[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrace"
version = "0.1.0"
description = "Evidence-centric local-first verification and OSINT workflow system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11,<0.12",
    "litellm>=1.72,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pdfplumber>=0.11.10",
]

[project.scripts]
sourcetrace-web = "sourcetrace_v2.operator.www:main"
sourcetrace-local = "sourcetrace_v2.operator.www:main"
sourcetrace-v2-run = "sourcetrace_v2.operator.run_minimal_flow:main"
sourcetrace-v2-readback = "sourcetrace_v2.operator.readback:main"
sourcetrace-www-start = "sourcetrace_v2.operator.www:start_main"
sourcetrace-www-status = "sourcetrace_v2.operator.www:status_main"
sourcetrace-www-stop = "sourcetrace_v2.operator.www:stop_main"
sourcetrace-www-wait = "sourcetrace_v2.operator.www:wait_main"
sourcetrace-www-write-user-unit = "sourcetrace_v2.operator.www:write_systemd_unit_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit/v2"]
pythonpath = ["src"]
